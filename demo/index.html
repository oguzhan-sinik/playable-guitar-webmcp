<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playable — Learn Any Song</title>
  <style>
    :root { --bg:#0f1117; --card:#1a1f2e; --accent:#6ee7b7; --text:#e8ecf4; --muted:#8b95a8; --line:#2a3348; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .wrap { max-width:720px; margin:0 auto; padding:2rem 1.25rem 4rem; }
    h1 { font-size:1.75rem; margin:0 0 .25rem; }
    .tag { color:var(--muted); margin-bottom:1rem; }
    .card { background:var(--card); border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
    .card.flash { outline:2px solid var(--accent); }
    label, .card > label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.5rem; text-transform:uppercase; letter-spacing:.05em; }
    .levels { display:flex; gap:.5rem; margin-top:.5rem; }
    button { font:inherit; }
    .levels button, .chip, .toggle { padding:.6rem .75rem; border-radius:8px; border:1px solid var(--line); background:#12161f; color:var(--text); cursor:pointer; }
    .levels button { flex:1; }
    .levels button.active, .toggle.active, .chip.sel { border-color:var(--accent); color:var(--accent); }
    .chip { margin:0 .4rem .4rem 0; }
    .go { margin-top:1rem; padding:.85rem 1.1rem; border:none; border-radius:10px; background:var(--accent); color:#0f1117; font-weight:700; font-size:1rem; cursor:pointer; }
    .go.secondary { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:500; }
    .status { color:var(--muted); font-size:.9rem; min-height:1.25rem; margin-top:.75rem; }
    .hero { text-align:center; }
    .chords { font-size:1.6rem; font-weight:700; letter-spacing:.12em; color:var(--accent); margin:.75rem 0; }
    .facts { display:flex; gap:1.25rem; flex-wrap:wrap; }
    .facts div { text-align:center; }
    .facts span { font-size:1.15rem; font-weight:600; }
    .facts label { display:block; margin:0; font-size:.7rem; }
    .muted { color:var(--muted); font-weight:400; }
    .bars { margin-top:1rem; }
    .bar-row { display:flex; align-items:center; gap:.75rem; margin:.4rem 0; font-size:.85rem; }
    .bar-row > span:first-child { width:5.5rem; color:var(--muted); }
    .bar { flex:1; height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
    .bar > span { display:block; height:100%; background:var(--accent); }
    ul, ol { padding-left:1.1rem; margin:.5rem 0; }
    li { margin:.35rem 0; }
    .hidden { display:none; }
    .ladder { display:grid; gap:.5rem; }
    .ladder-item { padding:.75rem; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
    .ladder-item.sel { border-color:var(--accent); }
    #webmcpStatus { display:inline-block; font-size:.75rem; padding:.3rem .6rem; border-radius:99px; border:1px solid var(--line); color:var(--muted); margin-bottom:1.5rem; }
    #agentFeed { border-left:3px solid var(--accent); padding-left:.9rem; margin-bottom:1rem; }
    #agentFeed .feed-item { font-size:.9rem; color:var(--accent); margin:.3rem 0; }
    .mapping { margin-top:.25rem; font-size:1rem; display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; }
    .mapping div { white-space:nowrap; }
    .mapping .played { font-weight:700; }
    .mapping .arrow { color:var(--muted); }
    .reduction { color:var(--accent); font-weight:700; margin-top:.5rem; }
    .studio-chords { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 .75rem; }
    .studio-chords .chord-slot { text-align:center; cursor:pointer; padding:.35rem; border-radius:10px; border:1px solid transparent; }
    .studio-chords .chord-slot.current { border-color:var(--accent); background:#16202f; }
    .studio-chords svg { color:var(--text); }
    .studio-chords .chord-slot.current svg { color:var(--accent); }
    .chord-chip { cursor:pointer; border-bottom:1px dashed var(--muted); }
    .timeline { display:flex; gap:2px; margin:.5rem 0; height:14px; }
    .timeline .tl-seg { background:var(--line); border-radius:3px; position:relative; min-width:8px; }
    .timeline .tl-seg.playing { background:var(--accent); }
    .nowline { min-height:1.4rem; font-size:1.05rem; font-weight:700; color:var(--accent); margin-bottom:.5rem; }
    .notice { font-size:.95rem; line-height:1.5; padding:.75rem .9rem; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .transport { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:.6rem; }
    .transport .go { margin:0; padding:.7rem 1rem; }
    .studio-row { display:flex; align-items:center; gap:.75rem; margin:.6rem 0; font-size:.9rem; }
    .studio-row input[type=range] { flex:1; accent-color: var(--accent); }
    #webmcpDebug { font-size:.75rem; color:var(--muted); margin-top:2rem; border-top:1px solid var(--line); padding-top:.75rem; }
    .res-row { margin:.45rem 0; }
    .res-row .res-head { display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); }
    .res-row .res-head strong { color:var(--text); font-size:.85rem; }
    .res-row .bar { margin-top:.25rem; }
    .res-value { font-size:.95rem; font-weight:600; }
    .ok { color:var(--accent); } .warn { color:#fbbf24; } .bad { color:#f87171; } .miss { color:var(--muted); }
    .src-chip { display:inline-block; font-size:.72rem; padding:.15rem .55rem; margin:.15rem .3rem .15rem 0; border:1px solid var(--line); border-radius:99px; color:var(--muted); }
    a.src-chip { text-decoration:none; }
    a.src-chip:hover { border-color:var(--accent); color:var(--accent); }
    .conflict-box { border:1px solid #fbbf24; border-left:3px solid #fbbf24; border-radius:8px; padding:.6rem .75rem; margin:.5rem 0; font-size:.85rem; }
    .resolved-box { border-color:var(--accent); border-left-color:var(--accent); }
    .overall { font-size:1.05rem; font-weight:700; margin-top:.6rem; }
    .ev-list { font-size:.75rem; color:var(--muted); margin-top:.5rem; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Learn any song.</h1>
    <p class="tag">At your level.</p>
    <span id="webmcpStatus">Checking WebMCP…</span>

    <div id="agentFeed" class="hidden"></div>

    <div class="card">
      <label>Paste a song link</label>
      <input id="songUrl" placeholder="YouTube / Spotify / audio URL" style="width:100%; padding:.75rem; border-radius:8px; border:1px solid var(--line); background:#12161f; color:var(--text); font-size:1rem" />
      <label class="rights" style="display:flex; gap:.45rem; align-items:flex-start; margin-top:.6rem; text-transform:none; letter-spacing:0; font-size:.8rem">
        <input type="checkbox" id="rightsConfirm" style="margin-top:.15rem" />
        <span>I have permission or other lawful authorization to process media from this link (required for YouTube / direct-audio analysis).</span>
      </label>
      <button type="button" class="go" id="learn" style="width:100%">Learn This Song</button>
      <div class="muted" style="font-size:.8rem; margin-top:.5rem">YouTube · Spotify · Direct audio — analysis where processing is permitted; Spotify songs get agent research instead.</div>
      <div class="status" id="loadStatus"></div>
      <div id="sourceCard" class="hidden" style="margin-top:.75rem">
        <img id="sourceArt" class="hidden" alt="" style="max-width:100%; border-radius:8px; margin-bottom:.5rem" />
        <div id="sourceTitle" style="font-weight:600"></div>
        <div id="sourceNote" class="muted" style="font-size:.9rem; margin-top:.5rem"></div>
      </div>
      <label style="margin-top:1rem">Current Song</label>
      <div id="songTitle" style="font-weight:600">—</div>
      <label style="margin-top:1rem">Your Level</label>
      <div class="levels">
        <button type="button" data-level="BEGINNER" class="active">Beginner</button>
        <button type="button" data-level="INTERMEDIATE">Intermediate</button>
        <button type="button" data-level="ADVANCED">Advanced</button>
      </div>
      <button type="button" id="barre" class="toggle" style="margin-top:.6rem">Avoid barre chords</button>
      <div style="display:flex; gap:.5rem; flex-wrap:wrap">
        <button class="go" id="compile">Make It Playable</button>
        <button class="go secondary" id="analyze">Analyze Song</button>
        <button class="go secondary" id="explain">Why Easier?</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <label>Song Understanding</label>
      <div id="analysis"></div>
    </div>

    <div class="card hidden" id="researchCard">
      <label>Agent Research</label>
      <div id="researchBoard"></div>
      <div class="status" id="researchHint"></div>
    </div>

    <div class="card hidden" id="versionCard">
      <label id="levelLabel">Your Version</label>
      <div id="capo"></div>
      <div class="chords" id="chords"></div>
      <div id="metrics"></div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card hidden" id="whyCard">
      <label>Why Easier</label>
      <ul id="why"></ul>
    </div>

    <div class="card" id="sectionCard">
      <label>Start Here</label>
      <div id="sections"></div>
      <div id="sectionDetail" class="muted"></div>
    </div>

    <div class="card hidden" id="planCard">
      <label>Your Practice Plan</label>
      <ol id="plan"></ol>
      <button type="button" id="planAdd" class="go secondary">20-minute plan</button>
    </div>

    <div class="card hidden" id="mappingCard">
      <label>You Play → Song Harmony</label>
      <div class="mapping" id="mapping"></div>
    </div>

    <div class="card hidden" id="studioCard">
      <label id="studioTitle">Practice Studio</label>
      <div id="studioSub" class="muted" style="font-size:.9rem; margin-bottom:.75rem"></div>
      <div class="studio-chords" id="studioChords"></div>
      <div class="timeline" id="studioTimeline"></div>
      <div class="nowline" id="nowChord"></div>
      <div class="transport">
        <button type="button" class="go" id="studioPlay">▶ Play Practice Preview</button>
        <button type="button" class="go secondary" id="studioStop">■ Stop</button>
        <button type="button" class="toggle" id="studioLoop">Loop</button>
        <button type="button" class="toggle" id="studioMetronome">Metronome</button>
      </div>
      <div class="studio-row">
        <span class="muted">Tempo</span>
        <input type="range" id="tempoSlider" min="50" max="100" step="10" value="70" />
        <span id="tempoLabel" style="font-weight:700; color:var(--accent)">70%</span>
      </div>
      <div class="studio-row">
        <span class="muted">Count-in</span>
        <div class="levels" style="margin:0">
          <button type="button" data-countin="0">Off</button>
          <button type="button" data-countin="1" class="active">1 bar</button>
          <button type="button" data-countin="2">2 bars</button>
        </div>
        <button type="button" class="go secondary" id="studioPrepare" style="margin-left:auto; padding:.5rem .8rem; font-size:.85rem">Re-prepare</button>
      </div>
      <div class="status" id="studioStatus"></div>
    </div>

    <div class="card hidden" id="sessionCard">
      <label>Your Practice Session</label>
      <ol id="sessionSteps"></ol>
    </div>

    <div class="card hidden" id="ladderCard">
      <label>All Levels</label>
      <div class="ladder" id="ladder"></div>
    </div>
  </div>
  <div class="wrap"><div id="webmcpDebug" class="hidden"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
